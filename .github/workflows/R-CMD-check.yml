name: R-CMD-check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  R-CMD-check:
    # Skipped on the template repo itself — its DESCRIPTION ships `{{...}}`
    # placeholders (an invalid R package name) until /api/generate substitutes
    # them in a provisioned repo. Mirrors the app-template's CI guard.
    if: github.repository != 'dataimago/dissertation-rpkg-template'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
